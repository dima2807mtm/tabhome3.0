plugins {
    id 'com.android.application'
}

android {
    namespace 'local.tabhome'
    compileSdk 34

    defaultConfig {
        applicationId 'local.tabhome'
        minSdk 26
        targetSdk 33
        versionCode 3
        versionName '3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
