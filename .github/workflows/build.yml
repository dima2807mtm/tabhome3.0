name: build-apk

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange project files
        run: |
          set -e
          M=app/src/main
          mkdir -p $M/java/local/tabhome $M/res/values $M/assets/wallpapers
          for f in HomeActivity PinOverlay IconDrawable RealIconTile DockStore AppPickerOverlay NowPlayingListener NowPlayingCard CalendarCard; do
            if [ -f "$f.java" ]; then mv -f "$f.java" "$M/java/local/tabhome/"; fi
          done
          if [ -f styles.xml ]; then mv -f styles.xml "$M/res/values/"; fi
          for f in [0-9][0-9].jpg; do
            if [ -f "$f" ]; then mv -f "$f" "$M/assets/wallpapers/"; fi
          done
          if [ -f AndroidManifest.xml ]; then mv -f AndroidManifest.xml "$M/AndroidManifest.xml"; fi
          rm -f "build (1).gradle"
          cat > build.gradle <<'EOF'
          // root project: all settings are in settings.gradle and app/build.gradle
          EOF
          cat > settings.gradle <<'EOF'
          pluginManagement {
              plugins {
                  id 'com.android.application' version '8.5.2'
              }
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'TabHome'
          include ':app'
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'local.tabhome'
              compileSdk 34

              defaultConfig {
                  applicationId 'local.tabhome'
                  minSdk 26
                  targetSdk 33
                  versionCode 2
                  versionName '2.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF
          echo "--- project layout ---"
          find app -type f | sort
          test -f "$M/AndroidManifest.xml" || { echo "NO AndroidManifest.xml"; exit 1; }
          test -f "$M/java/local/tabhome/HomeActivity.java" || { echo "NO HomeActivity.java"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk tabhome.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tabhome-apk
          path: tabhome.apk
